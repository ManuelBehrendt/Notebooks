# The environment this recipe was written against. `Pkg.activate` on this folder and
# `Pkg.instantiate()` gives you the same package versions, whatever else is installed on your
# machine. The first cell of the notebook does both.
#
# The Manifest.toml next to it records the exact versions. It was resolved from the General
# registry against Mera 1.8.0, the first release with everything this recipe uses; the recipe
# itself was written on a development checkout of 1.8.0.
name = "probe_through_a_galaxy"

